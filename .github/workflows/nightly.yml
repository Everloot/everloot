name: Nightly
# A pre-release of the addon built from main, once a day when main has changed.
# The site's download stays on the stable release. See docs/RELEASING.md.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main has no new commits since the last nightly
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: plan
        env:
          FORCE: ${{ inputs.force }}
        run: |
          sha="$(git rev-parse HEAD)"
          last="$(git tag --list 'nightly-*' --sort=-creatordate | head -n 1)"
          if [ -n "${last}" ] && [ "${FORCE}" != "true" ] && [ "$(git rev-list --count "${last}..HEAD")" = "0" ]; then
            echo "main has not changed since ${last}; nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(sed -n 's/^## Version: *//p' addon/Everloot.toc | tr -d '\r' | sed 's/-.*//')"
          next="${current%.*}.$(( ${current##*.} + 1 ))"
          day="$(date -u +%Y%m%d)"
          previous="${last:-$(git tag --list 'addon-v*' --sort=-v:refname | head -n 1)}"
          {
            echo "build=true"
            echo "version=${next}-nightly.${day}.${GITHUB_RUN_NUMBER}"
            echo "tag=nightly-${day}.${GITHUB_RUN_NUMBER}"
            echo "previous=${previous}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Main still matches the planned source revision
        env:
          PLANNED_SHA: ${{ needs.plan.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "${PLANNED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6 jsonschema==4.25.1
      # Tests run on the tree exactly as committed, before the version is stamped.
      - name: Addon tests
        run: python addon/tests/event_identity.py && python addon/tests/collection_contract.py && python addon/tests/map_positions_contract.py && python addon/tests/loot_types_contract.py && python addon/tests/item_facts_contract.py && python addon/tests/auction_contract.py && python addon/tests/gold_contract.py && python addon/tests/ask_contract.py && python addon/tests/recipes_contract.py && python addon/tests/addons_contract.py && python addon/tests/mapbounds_contract.py && python addon/tests/market_contract.py && python addon/tests/drops_contract.py && python addon/tests/scan_prompt_contract.py && python addon/tests/auction_tab_contract.py && python addon/tests/options_contract.py && python addon/tests/gph_contract.py && python addon/tests/talents_contract.py && python addon/tests/plan_contract.py && python addon/tests/raid_contract.py && python addon/tests/completion_contract.py && python addon/tests/census_contract.py && python addon/tests/players_contract.py && python addon/tests/conveniences_contract.py && python addon/tests/protocol_contract.py && python addon/tests/no_ads_contract.py && python addon/tests/minimap_contract.py && python addon/tests/answers_contract.py
      - name: Connected planner contracts
        run: python addon/tests/raid_plan_contract.py && python addon/tests/planner_contract.py
      - name: Stamp the nightly version (this runner's copy only, never committed)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sed -i "s/^## Version: .*/## Version: ${VERSION}/" addon/Everloot.toc
          # core.lua gets the short form: the upload intake accepts at most 20 characters.
          sed -i "s/^E\.VERSION = \".*\"/E.VERSION = \"${VERSION%%.202*}\"/" addon/core.lua
          grep -n '^## Version' addon/Everloot.toc
          grep -n '^E.VERSION' addon/core.lua
      - run: python scripts/package-addon.py
      - name: Checksums
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir dist
          cp "web/public/downloads/Everloot-${VERSION}.zip" dist/
          (cd dist && sha256sum "Everloot-${VERSION}.zip" > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: nightly
          path: dist/
          if-no-files-found: error
  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nightly
          path: dist
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          args=(--repo "${REPO}" --target "${SHA}" --prerelease --generate-notes --title "Everloot Nightly ${VERSION} (${SHA:0:7})")
          if [ -n "${PREVIOUS}" ]; then args+=(--notes-start-tag "${PREVIOUS}"); fi
          gh release create "${TAG}" "${args[@]}" dist/*
      - name: Keep the newest 14 nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release list --repo "${REPO}" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("nightly-"))] | sort_by(.createdAt) | reverse | .[14:][].tagName' |
            while read -r old; do
              gh release delete "${old}" --repo "${REPO}" --yes --cleanup-tag
            done
