name: Refresh armory
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  crawl:
    if: github.repository == 'Everloot/everloot'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        region: [us, eu]
    concurrency:
      group: armory-${{ matrix.region }}
      cancel-in-progress: false
    steps:
      - name: Check configuration
        id: config
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$BNET_CLIENT_ID" ] || [ -z "$BNET_CLIENT_SECRET" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo '::notice::Armory secrets are not configured; skipping the crawl.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            kb/package-lock.json
            web/package-lock.json
            packages/protocol/package-lock.json
      - run: npm ci
        if: steps.config.outputs.ready == 'true'
        working-directory: packages/protocol
      - run: npm run build
        if: steps.config.outputs.ready == 'true'
        working-directory: packages/protocol
      - run: npm ci
        if: steps.config.outputs.ready == 'true'
        working-directory: web
      - run: npm ci
        if: steps.config.outputs.ready == 'true'
        working-directory: kb
      - name: Read Blizzard
        if: steps.config.outputs.ready == 'true'
        working-directory: kb
        run: npm run kb -- armory-crawl --region ${{ matrix.region }}
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
