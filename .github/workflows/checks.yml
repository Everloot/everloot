name: Release checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No secrets in any commit (gitleaks 8.30.1, checksum-verified)
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          # Only the history behind HEAD: a push to main checks main, a pull request checks main plus its commits.
          # Without --log-opts gitleaks scans every ref the checkout fetched, so an unmerged branch could fail main.
          ./gitleaks git --redact --no-banner --log-opts="--full-history HEAD" .
      - name: No private workspace paths
        run: python scripts/test_check_internal_paths.py && python scripts/check_internal_paths.py
      - name: Relative links in Markdown files resolve
        run: python scripts/check_md_links.py
      - name: The data pull request merges itself only for its two data files
        run: python scripts/test_check_changes_files.py
      - name: The Discord bridge maps posts, issues and feeds correctly
        run: python scripts/test_discord_bridge.py
      - name: Every commit is signed off (DCO)
        if: github.event_name == 'pull_request'
        run: python scripts/test_check_dco.py && python scripts/check_dco.py "origin/${{ github.base_ref }}" HEAD
      - name: No AI tool credits in commits or the PR description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/test_check_no_ai_credit.py && python scripts/check_no_ai_credit.py "origin/${{ github.base_ref }}" HEAD
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            packages/protocol/package-lock.json
            kb/package-lock.json
            web/package-lock.json
            companion/package-lock.json
            desktop/package-lock.json
      - run: npm ci && npm test && npm run typecheck && npm run build && git diff --exit-code -- dist schema
        working-directory: packages/protocol
      - name: The protocol version follows its semver rule against what is published
        run: npx tsx scripts/check-semver.ts
        working-directory: packages/protocol
      - run: npm ci
        working-directory: kb
      - run: npm ci
        working-directory: web
      - run: npm test -- --maxWorkers=2 && npm run typecheck
        working-directory: kb
      # On every run, not only when kb/wiki changes: new game data can also break a page's bindings.
      - name: Wiki pages pass the page check
        run: npm run kb -- wiki-check
        working-directory: kb
      - name: News posts pass the post check
        run: npm run kb -- news-check
        working-directory: kb
      - run: npm test && npm run typecheck && npm run lint && npm run build
        working-directory: web
      - run: npm ci && npm test && npm run typecheck
        working-directory: companion
      - run: npm ci && npm test && npm run typecheck && npm run build
        working-directory: desktop
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6 jsonschema==4.25.1
      - run: python addon/tests/event_identity.py && python addon/tests/collection_contract.py && python addon/tests/map_positions_contract.py && python addon/tests/loot_types_contract.py && python addon/tests/item_facts_contract.py && python addon/tests/auction_contract.py && python addon/tests/gold_contract.py && python addon/tests/ask_contract.py && python addon/tests/recipes_contract.py && python addon/tests/addons_contract.py && python addon/tests/mapbounds_contract.py && python addon/tests/market_contract.py && python addon/tests/drops_contract.py && python addon/tests/scan_prompt_contract.py && python addon/tests/auction_tab_contract.py && python addon/tests/options_contract.py && python addon/tests/gph_contract.py && python addon/tests/talents_contract.py && python addon/tests/plan_contract.py && python addon/tests/raid_contract.py && python addon/tests/completion_contract.py && python addon/tests/census_contract.py && python addon/tests/players_contract.py && python addon/tests/conveniences_contract.py && python addon/tests/protocol_contract.py && python addon/tests/no_ads_contract.py && python addon/tests/minimap_contract.py
      - name: Website plans import into the addon workspace
        run: python addon/tests/raid_plan_contract.py && python addon/tests/planner_contract.py
      - name: Alpha releases stay pre-releases
        run: python scripts/test_alpha_release.py
      # A released version's zip is the published download: rebuild it to prove the source packages, then
      # put the published one back. An unreleased version's zip must match the source byte for byte.
      # release.yml stays strict.
      - name: The addon zip matches the source, or the version is already released
        run: |
          version=$(sed -n 's/^## Version: *//p' addon/Everloot.toc | tr -d '[:space:]')
          git fetch --quiet --depth=1 origin "+refs/tags/addon-v*:refs/tags/addon-v*"
          python scripts/package-addon.py
          if git rev-parse --quiet --verify "refs/tags/addon-v$version" >/dev/null; then
            echo "addon-v$version is released: the zip builds, and the published one stays as it is."
            git checkout -- web/public/downloads
          else
            git diff --exit-code -- web/public/downloads
          fi
      - run: python addon/tests/answers_contract.py
