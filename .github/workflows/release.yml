name: Addon release
# Push a tag like addon-v0.3.1 and this builds the addon zip, checks it against the committed one,
# and publishes a GitHub release. See docs/RELEASING.md.
on:
  push:
    tags: ['addon-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the addon version
        run: |
          version="$(sed -n 's/^## Version: *//p' addon/Everloot.toc | tr -d '\r')"
          test "${GITHUB_REF_NAME}" = "addon-v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match addon version ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: The changelog has a section for this version
        run: |
          awk -v v="${VERSION}" '
            /^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for ${VERSION}"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6 jsonschema==4.25.1
      - name: Addon tests
        run: python addon/tests/event_identity.py && python addon/tests/collection_contract.py && python addon/tests/map_positions_contract.py && python addon/tests/loot_types_contract.py && python addon/tests/item_facts_contract.py && python addon/tests/auction_contract.py && python addon/tests/gold_contract.py && python addon/tests/ask_contract.py && python addon/tests/recipes_contract.py && python addon/tests/addons_contract.py && python addon/tests/mapbounds_contract.py && python addon/tests/market_contract.py && python addon/tests/drops_contract.py && python addon/tests/scan_prompt_contract.py && python addon/tests/auction_tab_contract.py && python addon/tests/options_contract.py && python addon/tests/gph_contract.py && python addon/tests/talents_contract.py && python addon/tests/plan_contract.py && python addon/tests/raid_contract.py && python addon/tests/completion_contract.py && python addon/tests/census_contract.py && python addon/tests/players_contract.py && python addon/tests/conveniences_contract.py && python addon/tests/protocol_contract.py && python addon/tests/no_ads_contract.py && python addon/tests/minimap_contract.py && python addon/tests/answers_contract.py
      - name: Connected planner contracts
        run: python addon/tests/raid_plan_contract.py && python addon/tests/planner_contract.py
      - name: The built zip matches the committed one
        run: |
          python scripts/package-addon.py
          git diff --exit-code -- web/public/downloads
          test -z "$(git status --porcelain -- web/public/downloads)" || { echo "The zip for ${VERSION} is not committed"; exit 1; }
      - name: Checksum
        run: |
          cp "web/public/downloads/Everloot-${VERSION}.zip" .
          sha256sum "Everloot-${VERSION}.zip" > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            Everloot-${{ env.VERSION }}.zip
            SHA256SUMS
            release-notes.md
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(git tag --list 'addon-v*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -n 1 || true)"
          args=(--title "Everloot addon ${GITHUB_REF_NAME#addon-v}" --notes-file release-notes.md --generate-notes --verify-tag)
          if grep -qx 'Release channel: Alpha' release-notes.md; then args+=(--prerelease); fi
          if [ -n "${previous}" ]; then args+=(--notes-start-tag "${previous}"); fi
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" Everloot-*.zip SHA256SUMS
