name: Game build watch
# Looks for a new WoW: Forever build twice an hour and, when there is one, opens a pull request with the
# regenerated game data. Never merges anything. See docs/BUILD_WATCH.md.
#
# No write token is ever in the same job as code that installs packages or parses downloaded files:
#   watch        read-only token; npm ci, version check, CDN read. Hands its files on as an artifact.
#   publish      write token (and BUILD_WATCH_TOKEN, only in its push step); runs no npm, no parser.
#   answer-eval  read-only token; npm ci, then the written-answer eval on the new files. Only when the repository
#                variable ANSWER_EVAL_MODEL is set. Its one secret, ANSWER_EVAL_KEY, is a model API key used for nothing
#                else and capped at the provider: the one exception to the rule above, accepted at that cap.
#   answer-note  pull-request comments only; runs no npm, no parser.
#   report       issues only.
on:
  schedule:
    # :07 and :37 rather than :00 and :30, when GitHub's scheduler is busiest. Worst case a build is
    # noticed about 30 minutes after Blizzard lists it, plus any delay GitHub adds to scheduled runs.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      product:
        description: "Blizzard product ids, comma separated. Empty: the list in kb/lists/build-watch.yaml"
        required: false
        default: ""
      redo:
        description: "Refresh the open pull request, or reopen a build whose pull request was closed without merging"
        type: boolean
        default: false
permissions: {}
# One run at a time: two runs must not push the same branch.
concurrency:
  group: build-watch
  cancel-in-progress: false
jobs:
  watch:
    # Forks have no reason to run this.
    if: github.repository == 'Everloot/everloot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      extracted: ${{ steps.watch.outputs.extracted }}
    steps:
      # Always the default branch: the data is compared with what is on main, wherever this run started.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            kb/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: kb
      # The knowledge-base CLI imports a few helpers from web/.
      - run: npm ci
        working-directory: web
      - name: Is there a new build?
        id: check
        working-directory: kb
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PRODUCT: ${{ inputs.product }}
          INPUT_REDO: ${{ inputs.redo }}
        run: |
          args=(--check)
          [ -n "$INPUT_PRODUCT" ] && args+=(--product "$INPUT_PRODUCT")
          [ "$INPUT_REDO" = "true" ] && args+=(--redo)
          npm run kb -- build-watch "${args[@]}"
      # The CDN index, kept between runs so a new build downloads only what changed. Restored only when
      # there is work, which is rare.
      - name: Restore the CDN index
        if: steps.check.outputs.needed == 'true'
        uses: actions/cache/restore@v6
        with:
          path: kb/cache
          key: build-watch-casc-${{ github.run_id }}
          restore-keys: build-watch-casc-
      - name: Read the new build and prepare the data
        if: steps.check.outputs.needed == 'true'
        id: watch
        working-directory: kb
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PRODUCT: ${{ inputs.product }}
          INPUT_REDO: ${{ inputs.redo }}
        run: |
          args=()
          [ -n "$INPUT_PRODUCT" ] && args+=(--product "$INPUT_PRODUCT")
          [ "$INPUT_REDO" = "true" ] && args+=(--redo)
          npm run kb -- build-watch "${args[@]}"
      # Which player questions the new build answers differently (riding skills, boss lists, a talent's classes...),
      # from the question bank's answer key on main's files and on the new ones. Added to each pull request's body;
      # informational, so a failure here never stops the data from being published.
      - name: List the answers the new build changes
        if: steps.watch.outputs.extracted == 'true'
        continue-on-error: true
        working-directory: kb
        run: |
          set -euo pipefail
          plan=data/build-watch/out/plan.json
          [ -f "$plan" ] || exit 0
          before=$(mktemp -d)
          git -C .. archive HEAD web/src/data/game-data | tar -x -C "$before"
          npm run -s kb -- question-bank --files-only --game-data "$before/web/src/data/game-data" --out "$before/before.jsonl"
          npm run -s kb -- question-bank --files-only --out "$before/after.jsonl"
          npm run -s kb -- question-diff "$before/before.jsonl" "$before/after.jsonl" --max-rows 25 --out "$before/answers.md"
          section="$before/section.md"
          { echo; echo "<details><summary>Answers this build changes (question bank)</summary>"; echo
            sed -e 's/^# /### /' -e 's/^## /#### /' "$before/answers.md"; echo; echo "</details>"; } > "$section"
          jq -r '.[] | select(.action == "create" or .action == "update") | .bodyFile' "$plan" | while read -r body; do
            [[ "$body" == data/build-watch/out/* && "$body" != *..* && -f "$body" ]] || continue
            # GitHub refuses a body over 65,536 characters and the publish step would fail: the body stays under
            # 64,000 bytes (a character is at least one), or gets one line in place of the list.
            if [ $(( $(wc -c < "$body") + $(wc -c < "$section") )) -le 64000 ]; then
              cat "$section" >> "$body"
            else
              printf '\n_The answers this build changes did not fit in this description: run `question-diff` locally (docs/BUILD_WATCH.md, step 7)._\n' >> "$body"
            fi
          done
      # The index is only a download cache, so it is kept even when the run fails.
      - name: Save the CDN index
        if: always() && steps.watch.outputs.extracted == 'true'
        uses: actions/cache/save@v6
        with:
          path: kb/cache
          key: build-watch-casc-${{ github.run_id }}
      - name: Hand the files to the publish job
        if: always() && steps.watch.outputs.extracted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-watch
          retention-days: 3
          if-no-files-found: error
          path: |
            web/src/data/game-data
            addon/modules/raid_data.lua
            kb/curated/recheck.json
            kb/data/build-watch/out

  publish:
    needs: watch
    # Also when the watch step failed for one product: the others still have a plan to publish.
    if: always() && needs.watch.outputs.extracted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: build-watch
      - name: Open or update the pull requests
        env:
          # BUILD_WATCH_TOKEN if the repository has it, so the checks run on the pull request (pull
          # requests opened with the built-in token do not start workflows). Used by this step only.
          PUSH_TOKEN: ${{ secrets.BUILD_WATCH_TOKEN || github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          plan=kb/data/build-watch/out/plan.json
          [ -f "$plan" ] || { echo "no plan.json: nothing to publish"; exit 0; }
          export GH_TOKEN="$PUSH_TOKEN"
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          g() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          git config user.name "everloot-build-watch"
          git config user.email "build-watch@users.noreply.github.com"
          start=$(git rev-parse HEAD)
          jq -c '.[] | select(.action == "create" or .action == "update")' "$plan" | while read -r item; do
            product=$(jq -r .product <<<"$item")
            build=$(jq -r .buildId <<<"$item")
            branch=$(jq -r .branch <<<"$item")
            title=$(jq -r .title <<<"$item")
            bodyrel=$(jq -r .bodyFile <<<"$item")
            # The plan comes from the watch job, which parses downloaded files. Trust none of it blindly.
            [[ "$product" =~ ^[a-z0-9_]+$ && "$build" =~ ^[0-9]+$ && "$branch" =~ ^game-build/[a-z0-9_]+-[0-9]+-[0-9a-f]{8}$ ]] \
              || { echo "refusing odd plan values"; exit 1; }
            [[ "$bodyrel" == data/build-watch/out/* && "$bodyrel" != *..* ]] || { echo "refusing odd body path"; exit 1; }
            body="$GITHUB_WORKSPACE/kb/$bodyrel"
            mapfile -t removes < <(jq -r '.remove[]?' <<<"$item")
            git switch -C "$branch" "$start"
            for f in "${removes[@]}"; do
              [[ "$f" =~ ^web/src/data/game-data/raid-[0-9.]+\.json$ ]] || { echo "refusing to remove $f"; exit 1; }
              git rm -q -f -- "$f"
            done
            git add -A -- web/src/data/game-data addon/modules/raid_data.lua kb/curated/recheck.json
            # Only the files the generators write may change, and the recheck scopes the watch adds.
            allowed='^(web/src/data/game-data/(talents/[a-z]+\.json|raid-[0-9.]+\.json|raid\.ts|map\.json|client-layer\.json|races\.json|client-achievements\.json|client-encounters\.json|client-mounts\.json|spell-values\.json|client-digests\.json|changes/[a-z0-9_]+-[0-9]+\.json)|addon/modules/raid_data\.lua|kb/curated/recheck\.json)$'
            unexpected=$(git diff --cached --name-only | grep -Ev "$allowed" || true)
            [ -z "$unexpected" ] || { echo "unexpected files in the change:"; echo "$unexpected"; exit 1; }
            # raid.ts may change its import line and nothing else.
            odd=$(git diff --cached -U0 -- web/src/data/game-data/raid.ts | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---)' | grep -Ev '^[+-]import raid from "\./raid-[0-9.]+\.json";$' || true)
            [ -z "$odd" ] || { echo "raid.ts changed beyond its import line:"; echo "$odd"; exit 1; }
            if git diff --cached --quiet; then
              echo "$product $build: the files already match $BASE"
            else
              git commit -s -m "$title" -m "Regenerated by the build watch workflow from Blizzard's public CDN with the site's own generators. Encrypted blocks are skipped, never decrypted."
            fi
            # Push only when the branch would change, so a rerun leaves an open pull request alone.
            # A branch that exists is replaced only if nobody has pushed to it since we looked.
            if g fetch --quiet origin "$branch" 2>/dev/null; then
              remote=$(git rev-parse FETCH_HEAD)
              if git diff --quiet FETCH_HEAD HEAD -- web/src/data/game-data addon/modules/raid_data.lua kb/curated/recheck.json; then
                echo "$branch is already up to date"
              else
                g push --force-with-lease="refs/heads/$branch:$remote" origin "$branch"
              fi
            else
              g push origin "$branch"
            fi
            existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh pr edit "$existing" --title "$title" --body-file "$body"
            else
              gh pr create --base "$BASE" --head "$branch" --title "$title" --body-file "$body"
            fi
            git switch --detach "$start"
          done

  # How well a model answers players' questions from the new build's files: a sample of the question bank's keyed
  # questions (English and Spanish), each sent with answer_sources' evidence under the in-game /ask rules, the reply
  # scored against the files (docs/design/specs/2026-10-27-question-bank-design.md, phase 2). Informational: it never
  # holds up the data, and a run without the variable skips it.
  answer-eval:
    needs: [watch, publish]
    if: always() && needs.watch.outputs.extracted == 'true' && vars.ANSWER_EVAL_MODEL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            kb/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: kb
      - run: npm ci
        working-directory: web
      - uses: actions/download-artifact@v8
        with:
          name: build-watch
      - name: Fetch the approved knowledge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p kb/data/release
          gh release download mcp-knowledge-2026-10-05 --repo "$GITHUB_REPOSITORY" --dir kb/data/release
          echo 'd21bb3c414db9f5f40a3146fe78d0ba3e7071eb083c59003fbf6062bd8ab41eb  kb/data/release/2026-10-05-everloot-public.sqlite' | sha256sum --check
      - name: Score written answers on the new files
        working-directory: kb
        env:
          ANSWER_EVAL_KEY: ${{ secrets.ANSWER_EVAL_KEY }}
          BASE_URL: ${{ vars.ANSWER_EVAL_BASE_URL || 'https://openrouter.ai/api/v1' }}
          MODEL: ${{ vars.ANSWER_EVAL_MODEL }}
        run: |
          set -euo pipefail
          out=data/answer-eval && mkdir -p "$out"
          key=$(mktemp) && chmod 600 "$key" && printf '%s' "$ANSWER_EVAL_KEY" > "$key"
          unset ANSWER_EVAL_KEY
          npm run -s kb -- question-bank --files-only --spanish --out "$out/bank.jsonl"
          npm run -s kb -- question-answer-eval "$out/bank.jsonl" --db data/release/2026-10-05-everloot-public.sqlite \
            --base-url "$BASE_URL" --model "$MODEL" --key-file "$key" --sample 60 --out "$out/answer-eval.md"
          rm -f "$key"
          cp data/build-watch/out/plan.json "$out/plan.json"
      - uses: actions/upload-artifact@v7
        with:
          name: answer-eval
          retention-days: 3
          if-no-files-found: error
          path: |
            kb/data/answer-eval/answer-eval.md
            kb/data/answer-eval/plan.json

  answer-note:
    needs: answer-eval
    if: needs.answer-eval.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # A failed eval reads as success to this job (continue-on-error) but leaves no report: then there is nothing to say.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: answer-eval
      - name: Comment the scores on each build's pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -f answer-eval.md ] && [ -f plan.json ] || { echo "no report"; exit 0; }
          note=$(mktemp)
          # GitHub refuses a comment over 65,536 characters: the report is cut well under it.
          { echo "<details><summary>Written answers on this build's files</summary>"; echo
            head -c 60000 answer-eval.md | sed -e 's/^# /### /' -e 's/^## /#### /'; echo; echo "</details>"; } > "$note"
          jq -r '.[] | select(.action == "create" or .action == "update") | .branch' plan.json | while read -r branch; do
            [[ "$branch" =~ ^game-build/[a-z0-9_]+-[0-9]+-[0-9a-f]{8}$ ]] || { echo "refusing odd branch"; continue; }
            pr=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')
            if [ -n "$pr" ]; then gh pr comment "$pr" --repo "$REPO" --body-file "$note"; fi
          done

  report:
    needs: [watch, publish]
    if: always() && github.event_name == 'schedule' && github.repository == 'Everloot/everloot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Close the failure issue once the watch works again
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Game build watch is failing in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "The build watch ran cleanly again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
      # One issue after two failed scheduled runs in a row, none while it stays open. The red run
      # already notifies; this is the record that does not scroll away.
      - name: Open one issue if it keeps failing
        if: ${{ contains(needs.*.result, 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-watch.yml --event schedule --status completed --limit 1 --json conclusion --jq '.[0].conclusion // empty')
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Game build watch is failing in:title" --json number --jq '.[0].number // empty')
          if [ "$previous" = "failure" ] && [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Game build watch is failing" --body "The scheduled build watch failed twice in a row. Latest run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          See docs/BUILD_WATCH.md for what to check. This issue closes itself when a scheduled run succeeds, and no further issue is opened while it is open."
          fi
