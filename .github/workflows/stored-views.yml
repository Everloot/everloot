name: Build the stored views
# The stored-views job (#1354): the settled list, the stored views, the guild ladder, the Auction House boards, the
# coverage score and the auction reports, built for the snapshot the cron's last heartbeat names
# (web/scripts/stored-views.ts). The cron Worker's 128 MB ran out partway through them on runs with new uploads; a
# runner has gigabytes. Each view is rewritten only when its stamp is not that snapshot's, so a run with nothing new
# writes nothing. Five minutes after the snapshot cron's runs at :00, :10, ..., every quarter hour.
# With EVERLOOT_SNAPSHOT at "job" in web/wrangler.cron.jsonc it first folds new uploads into the corpus and the
# rollups and writes the cron heartbeat, which also outgrew the Worker (docs/OPERATIONS.md, "The snapshot on the job").
# Off until the repository variable STORED_VIEWS_JOB is "on"; docs/OPERATIONS.md, "The stored-views job", says how
# it is switched on and how the cron Worker hands the views over.
on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rewrite every view, current or not
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: stored-views
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Everloot/everloot' && vars.STORED_VIEWS_JOB == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            packages/protocol/package-lock.json
            kb/package-lock.json
            web/package-lock.json
      - run: npm ci && npm run build
        working-directory: packages/protocol
      - run: npm ci
        working-directory: kb
      - run: npm ci
        working-directory: web
      - name: Build the stored views
        working-directory: web
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Its own pair, set from the values the cron Worker holds, so the publication pass reads the same opt-outs.
          SUPABASE_URL: ${{ secrets.VIEWS_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VIEWS_SUPABASE_SERVICE_ROLE_KEY }}
          GAME_DATA_ACCESS_KEY_ID: ${{ secrets.GAME_DATA_ACCESS_KEY_ID }}
          GAME_DATA_SECRET_ACCESS_KEY: ${{ secrets.GAME_DATA_SECRET_ACCESS_KEY }}
          GAME_DATA_BUCKET: ${{ secrets.GAME_DATA_BUCKET }}
          GAME_DATA_S3_ENDPOINT: ${{ secrets.GAME_DATA_S3_ENDPOINT }}
          EVERLOOT_TRUSTED_INSTALLS: ${{ secrets.EVERLOOT_TRUSTED_INSTALLS }}
          REBUILD: ${{ inputs.rebuild && '--rebuild' || '' }}
        run: npm run stored-views -- $REBUILD
