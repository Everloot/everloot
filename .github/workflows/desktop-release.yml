name: Desktop release
# Push a tag like desktop-v0.1.0 and this builds Everloot Desktop App for Windows, macOS and Linux,
# checks the tag against desktop/package.json, and publishes a GitHub release. See desktop/README.md.
# Run it by hand (Actions > Desktop release > Run workflow, or `gh workflow run desktop-release.yml
# --ref <branch>`) for a dry run: the same builds, kept as workflow artifacts, nothing published.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the desktop version
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            test "${GITHUB_REF_NAME}" = "desktop-v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match desktop version ${version}"; exit 1; }
          else
            echo "Dry run on ${GITHUB_REF_NAME}: building desktop ${version}, publishing nothing"
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: The changelog has a section for this version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          grep -q "^## \[${GITHUB_REF_NAME}\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            kb/package-lock.json
            companion/package-lock.json
            desktop/package-lock.json
      # The desktop bundle takes only JavaScript modules from web/ (zod, the save-file parser); its
      # native better-sqlite3 is never loaded, and compiling it fails on the Windows runner.
      - run: npm ci --ignore-scripts
        working-directory: web
      # The settled-list helpers import the protocol through kb; only their JavaScript is bundled.
      - run: npm ci --ignore-scripts
        working-directory: kb
      - run: npm ci
        working-directory: companion
      - run: npm ci
        working-directory: desktop
      - run: npm test && npm run typecheck
        working-directory: desktop
      - run: npm run pack
        working-directory: desktop
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p out
          find desktop/release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: out/*
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The changelog has a section for this version
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          awk -v v="desktop-v${version}" '
            /^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for desktop-v${version}"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: out
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* --title "Everloot Desktop App ${GITHUB_REF_NAME#desktop-v}" --notes-file release-notes.md
