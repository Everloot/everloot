name: Refresh changes
# The build registry behind /changes. Blue polling now belongs to /api/cron/blue.
# TODO (docs/design/specs/2026-10-20-blue-tracker-live.md, step 4): add a daily
# R2 posts copy to git once read access is available to this workflow. No second forum reader.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: changes-refresh
  cancel-in-progress: false
jobs:
  collect:
    # Reads the public internet and writes files. No token, no write access.
    if: github.repository == 'Everloot/everloot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.builds.outcome == 'failure' }}
      builds: ${{ steps.builds.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Start from the open data pull request, if there is one
        run: |
          git fetch --depth=1 origin data/changes:refs/remotes/origin/data/changes || exit 0
          git checkout origin/data/changes -- kb/changes/builds.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            kb/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: kb
      # The knowledge-base CLI imports a few helpers from web/.
      - run: npm ci
        working-directory: web
      - name: Builds (Blizzard's public version service)
        id: builds
        continue-on-error: true
        run: npm run kb -- builds-check --registry changes/builds.json
        working-directory: kb
      - uses: actions/upload-artifact@v7
        with:
          name: changes
          path: |
            kb/changes/builds.json
          retention-days: 1
  publish:
    # The only job with a write token, and only the steps that push, open or merge the pull request see it.
    needs: collect
    if: github.repository == 'Everloot/everloot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: changes
          path: kb/changes
      - name: Is there anything new?
        id: news
        run: |
          # Every run moves the "last asked" and "last seen" times. Only a new or changed build
          # is worth a pull request, against main and against what the open pull request already holds.
          meaningful() { grep -E '^[+-] ' | grep -vE '^[+-]\s+"(at|lastSeen)":' | grep -q .; }
          git add kb/changes/builds.json
          news=no
          if git diff --cached -U0 -- kb/changes | meaningful; then news=yes; fi
          if [ "$news" = yes ] && git rev-parse -q --verify origin/data/changes >/dev/null; then
            news=no
            if git diff -U0 origin/data/changes -- kb/changes | meaningful; then news=yes; fi
          fi
          echo "news=$news" >> "$GITHUB_OUTPUT"
      - name: Update the rolling pull request
        id: pr
        if: steps.news.outputs.news == 'yes'
        env:
          # BUILD_WATCH_TOKEN so that CI runs on the pull request (a GITHUB_TOKEN push or PR does not trigger it).
          GH_TOKEN: ${{ secrets.BUILD_WATCH_TOKEN || github.token }}
          HAVE_PAT: ${{ secrets.BUILD_WATCH_TOKEN != '' }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HAVE_PAT" != true ]; then
            echo "::warning::BUILD_WATCH_TOKEN is not set. Falling back to GITHUB_TOKEN: the pull request is opened, but CI will not run on it, so it cannot be merged automatically."
          fi
          git config user.name 'everloot-changes[bot]'
          git config user.email 'hello@everloot.app'
          git checkout -q -B data/changes
          git commit -s -q -m 'Changes: refresh builds'
          lease=$(git rev-parse -q --verify origin/data/changes || true)
          git push --force-with-lease="data/changes:${lease}"             "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" data/changes
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -z "$(gh pr list --repo "$REPO" --head data/changes --state open --json number --jq '.[0].number')" ]; then
            gh pr create --repo "$REPO" --base main --head data/changes               --title 'data(kb): new game builds'               --body 'Automatic refresh of kb/changes: new or changed game builds. The Refresh changes workflow keeps this one pull request up to date and merges it itself, but only when it touches nothing except kb/changes/blue-posts.json and kb/changes/builds.json and every check on the head commit has passed. Every merge deploys the site, so at most one deploy per 30 minutes.'
          fi
      - name: Merge it, only if it is safe
        if: steps.news.outputs.news == 'yes'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.BUILD_WATCH_TOKEN || github.token }}
          HAVE_PAT: ${{ secrets.BUILD_WATCH_TOKEN != '' }}
          REPO: ${{ github.repository }}
          PUSHED: ${{ steps.pr.outputs.sha }}
        run: |
          # Never --auto: main may have no required checks, and then GitHub would merge without waiting.
          fail() { echo "::error::$1 The pull request stays open."; exit 1; }
          [ "$HAVE_PAT" = true ] || fail "BUILD_WATCH_TOKEN is not set, so CI cannot have run on the pull request."
          pr=$(gh pr list --repo "$REPO" --head data/changes --state open --json number --jq '.[0].number')
          [ -n "$pr" ] || fail "No open data/changes pull request."
          head_is_ours() { [ "$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)" = "$PUSHED" ]; }
          only_data_files() { gh pr diff "$pr" --repo "$REPO" --name-only | python3 scripts/check_changes_files.py; }
          # (c) the head is the commit this run pushed, (a) it touches only the two data files.
          head_is_ours || fail "The pull request head is not the commit this run pushed."
          only_data_files || fail "The pull request touches files outside the data allowlist."
          # (b) every check on the head commit passes. Wait for the checks to be reported, then for them to finish.
          reported=0
          for _ in $(seq 1 18); do
            reported=$(gh pr checks "$pr" --repo "$REPO" --json name --jq length 2>/dev/null || echo 0)
            [ "$reported" -gt 0 ] && break
            sleep 10
          done
          [ "$reported" -gt 0 ] || fail "No checks were reported on the pull request."
          timeout 900 gh pr checks "$pr" --repo "$REPO" --watch --interval 20 || fail "A check failed or did not finish within 15 minutes."
          bad=$(gh pr checks "$pr" --repo "$REPO" --json state --jq '[.[] | select(.state != "SUCCESS" and .state != "SKIPPED")] | length')
          [ "$bad" = 0 ] || fail "$bad check(s) did not succeed."
          # Everything again right before the merge; --match-head-commit refuses if the head moved after this.
          head_is_ours || fail "The pull request head moved while the checks ran."
          only_data_files || fail "The pull request touches files outside the data allowlist."
          gh pr merge "$pr" --repo "$REPO" --squash --match-head-commit "$PUSHED" --delete-branch             --subject 'Changes: refresh builds' --body 'Automatic data refresh. Only kb/changes data files; all checks passed.'
      - name: Fail the run if a source failed, so it shows up
        if: needs.collect.outputs.failed == 'true'
        env:
          BUILDS: ${{ needs.collect.outputs.builds }}
        run: |
          echo "::error::A source failed in the collect job (builds: $BUILDS). That step's log in collect says why."
          exit 1
