name: Backup role
on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/backup-role.yml']
permissions:
  contents: read
jobs:
  backup-role:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['15', '17']
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@v7
      - name: Apply twice and verify effective permissions and real RLS reads
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/backup_exporter_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261110180000_backup_exporter_role.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261110180000_backup_exporter_role.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/backup_exporter.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/backup_exporter_behavior.sql
      - name: Creator membership is administrative only
        if: matrix.postgres == '17'
        run: |
          psql -v ON_ERROR_STOP=1 -c 'grant backup_exporter to postgres with admin true, inherit false, set false'
          psql -v ON_ERROR_STOP=1 -f supabase/tests/backup_exporter.sql
          psql -v ON_ERROR_STOP=1 -c 'grant backup_exporter to postgres with inherit true'
          if psql -v ON_ERROR_STOP=1 -f supabase/tests/backup_exporter.sql; then
            echo 'Assertion accepted inherited backup access'; exit 1
          fi
          psql -v ON_ERROR_STOP=1 -c 'grant backup_exporter to postgres with inherit false, set true'
          if psql -v ON_ERROR_STOP=1 -f supabase/tests/backup_exporter.sql; then
            echo 'Assertion accepted SET ROLE access'; exit 1
          fi
          psql -v ON_ERROR_STOP=1 -c 'grant backup_exporter to postgres with set false'
          psql -v ON_ERROR_STOP=1 -c 'grant backup_exporter to anon with admin true, inherit false, set false'
          if psql -v ON_ERROR_STOP=1 -f supabase/tests/backup_exporter.sql; then
            echo 'Assertion accepted a different administrative member'; exit 1
          fi
          psql -v ON_ERROR_STOP=1 -c 'revoke backup_exporter from anon'
          psql -v ON_ERROR_STOP=1 -c 'grant service_role to backup_exporter with inherit false, set false'
          if psql -v ON_ERROR_STOP=1 -f supabase/tests/backup_exporter.sql; then
            echo 'Assertion accepted an application role granted to exporter'; exit 1
          fi
          psql -v ON_ERROR_STOP=1 -c 'revoke service_role from backup_exporter'
          psql -v ON_ERROR_STOP=1 -f supabase/tests/backup_exporter.sql
      # Blizzard auction prices (issue #1122): applied after the backup role, as in production, and twice; then the
      # 30-day purge, the reader, the effective grants and the backup exclusion, which the new migration enforces
      # itself (the applied backup role migration is left as it is).
      - name: Blizzard auction prices, applied twice
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113120000_blizzard_auctions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113120000_blizzard_auctions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/blizzard_auctions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/backup_exporter.sql
