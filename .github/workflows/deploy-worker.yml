name: Deploy the site to Cloudflare Workers
# Every merge to main that touches the site builds it with OpenNext and deploys the Worker (web/wrangler.jsonc),
# stamped with the commit (web/scripts/cf-deploy.mjs). Runs only while the repository variable WORKER_DEPLOY is "1".
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "kb/**"
      - "packages/protocol/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-worker
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.WORKER_DEPLOY == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            packages/protocol/package-lock.json
            kb/package-lock.json
            web/package-lock.json
      - run: npm ci && npm run build
        working-directory: packages/protocol
      - run: npm ci
        working-directory: kb
      - run: npm ci
        working-directory: web
      - name: Build and deploy the Worker
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Public values, read at build time; they are repository variables, not secrets.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GAME_ASSETS_URL: ${{ vars.NEXT_PUBLIC_GAME_ASSETS_URL }}
          NEXT_PUBLIC_BULK_URL: ${{ vars.NEXT_PUBLIC_BULK_URL }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_METRICOOL_HASH: ${{ vars.NEXT_PUBLIC_METRICOOL_HASH }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run cf:deploy
      # Fills the edge cache for the new version and fails the run if any page in the sitemap does not answer 200.
      - name: Warm and check the pages
        working-directory: web
        run: node scripts/cf-warm.mjs https://everloot.app "$GITHUB_SHA"
