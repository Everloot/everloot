version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(web)"
    groups:
      web-dependencies:
        patterns: ["*"]
    ignore:
      # Major versions are planned upgrades (Next, ESLint, Tailwind, Node types), done by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /kb
    schedule:
