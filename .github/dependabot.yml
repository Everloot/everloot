      prefix: "chore(desktop)"
    groups:
      desktop-dependencies:
        patterns: ["*"]
    ignore:
      # Major versions are planned upgrades (Electron, the MCP SDK, Node types), done by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(infra)"
    groups:
      actions:
        patterns: ["*"]
