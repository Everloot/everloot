version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(web)"
    groups:
      web-dependencies:
        patterns: ["*"]
    ignore:
      # Major versions are planned upgrades (Next, ESLint, Tailwind, Node types), done by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /kb
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(kb)"
    groups:
      kb-dependencies:
        patterns: ["*"]
    ignore:
      # Major versions are planned upgrades (Next, ESLint, Tailwind, Node types), done by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Every game-data manifest records this library's version (kb/test/client-extract.test.ts), so a bump must come
      # with a build refresh that restamps them; done by hand. 2.17+ also needs the Temporal API, which Node 22 lacks (#1448).
      - dependency-name: "@rhyster/wow-casc-dbc"
  - package-ecosystem: npm
    directory: /companion
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(companion)"
    groups:
      companion-dependencies:
        patterns: ["*"]
    ignore:
      # Major versions are planned upgrades (Next, ESLint, Tailwind, Node types), done by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /packages/protocol
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(protocol)"
    groups:
      protocol-dependencies:
        patterns: ["*"]
    ignore:
      # Major versions are planned upgrades (Next, ESLint, Tailwind, Node types), done by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(desktop)"
    groups:
      desktop-dependencies:
        patterns: ["*"]
    ignore:
      # Major versions are planned upgrades (Electron, the MCP SDK, Node types), done by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(infra)"
    groups:
      actions:
        patterns: ["*"]
