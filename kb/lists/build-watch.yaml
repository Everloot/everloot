# Which Blizzard products the build watch follows (docs/BUILD_WATCH.md).
# `live` is true once players can play the product; until then everything read from it is a spoiler
# (docs/DATA_POLICY.md). Product ids are Blizzard's; find one with `npm run kb -- builds-check`.
region: us
products:
  # WoW Forever's own product. It replaced the beta (wow_classic_beta), which is no longer followed.
  # `live` turns true when players can play it, at launch (docs/LAUNCH_DAY.md).
  - product: wowf
    label: WoW Forever
    live: false
