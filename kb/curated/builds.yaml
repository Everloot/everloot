- kind: build
  id: rogue-leveling-combat
  name: "Rogue leveling: Combat"
  game_version: forever
  body: >-
    This is a draft starter build for leveling a Rogue, the first 21 points, all in Combat. Efficient
    Strikes and Coup de Grace open the tree with Sinister Strike and Eviscerate. Precision goes to full
    rank because Weapon Expertise needs it, and Deflection goes to full rank because Riposte needs it.
    Endurance and Lightning Reflexes at full rank make up the twenty points Blade Flurry asks for,
    with the last of them in Weapon Expertise.
