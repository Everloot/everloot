- kind: build
  id: hunter-leveling-beast-mastery
  name: "Hunter leveling: Beast Mastery"
  game_version: forever
  body: >-
    This is a draft starter build for leveling a Hunter, the first 21 points, all in Beast Mastery. The
    points go to the pet first: Endurance Training, then Unleashed Fury and Ferocity once their rows
    open. Focused Fire and Improved Aspect of the Monkey fill the second row so the third opens, then
    Pathfinding, and Bestial Swiftness is taken because Intimidation needs it or Bestial Wrath, and
    Intimidation is where the twenty-first point lands.
