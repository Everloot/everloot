- kind: build
  id: warrior-leveling-arms
  name: "Warrior leveling: Arms"
  game_version: forever
  body: >-
    This is a draft starter build for leveling a Warrior, the first 21 points, all in Arms. Improved Rend
    goes to full rank first because Deep Wounds needs it, and Deep Wounds is in turn what opens Impale.
    Improved Heroic Strike, Improved Charge and Improved Overpower fill the rows that gate the tree, and
    Deflection makes up the twenty points Sweeping Strikes asks for. Two-Handed Weapon Specialization
    assumes you level with a two-handed weapon.
  source_url: https://everloot.app/tools/talents/warrior/b/EL1-warrior-1491-1.60.1.70862-MTA1OTQ1OjEsMTA1OTQ3OjIsMTA1OTQ4OjMsMTA1OTUwOjMsMTA1OTUyOjIsMTA1OTU1OjIsMTA1OTU2OjMsMTA1OTU3OjIsMTA1OTU4OjM
