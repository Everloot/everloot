  id: priest-leveling-shadow-magic
  name: "Priest leveling: Shadow Magic"
  game_version: forever
  body: >-
    This is a draft starter build for leveling a Priest, the first 21 points, all in Shadow Magic.
    Spirit Tap comes first, then Improved Shadow Word: Pain and Improved Mind Blast for the spells you
    open fights with. Mind Flay is taken as soon as its row opens, and Shadow Focus fills the points the
    fourth row asks for. Shadow Weaving and Vampiric Embrace take that row, and the twenty-first point
    goes to Devouring Contagion.
