  id: paladin-leveling-retribution
  name: "Paladin leveling: Retribution"
  game_version: forever
  body: >-
    This is a draft starter build for leveling a Paladin, the first 21 points, all in Retribution.
    Benediction takes the first five points and Deflection the next three, then Conviction, Improved
    Judgement and Sanctified Judgement fill the second row so the third row opens. Seal of Command goes
    in because Vengeance needs it, and with Pursuit of Justice and Sacred Arbiter that makes the twenty
    points the fifth row asks for.
